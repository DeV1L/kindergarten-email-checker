services:
  checker:
    image: ghcr.io/dev1l/kindergarten-email-checker:${IMAGE_TAG:-latest}
    env_file: .env
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
