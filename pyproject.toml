[project]
name = "kindergarten-email-checker"
version = "0.1.0"
description = "Reads a kindergarten's Spanish emails from a dedicated mailbox, summarizes them in Russian with urgency and dates, and posts to a Telegram group."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0,<2",
    "imap-tools>=1.10",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "html2text>=2024.2.26",
    "pypdf>=5",
    "pypdfium2>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
kindergarten-email-checker = "kindergarten_email_checker.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kindergarten_email_checker"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
