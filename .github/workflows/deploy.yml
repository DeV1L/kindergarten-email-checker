name: Deploy
run-name: Deploy ${{ inputs.tag }} from ${{ github.ref_name }}

# Manual runs only. Deploys the chart from the branch in "Use workflow from" with an image tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag, for example latest, feature-imap-loop or sha-1a2b3c4
        required: true
        default: latest

# One deploy at a time. A second run waits for the first one.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Write the kubeconfig
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG }}
        run: |
          umask 077
          printf '%s\n' "$KUBECONFIG" > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
      - name: Deploy
        id: deploy
        run: >
          helm upgrade --install kindergarten-email-checker charts/kindergarten-email-checker
          --namespace kindergarten
          --set-string image.tag="$TAG"
          --wait
      - name: Generate summary
        if: always() && steps.deploy.outcome != 'skipped'
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          revision=$(helm -n kindergarten status kindergarten-email-checker -o json | jq -r .version)
          digest=$(kubectl -n kindergarten get pods -l app.kubernetes.io/instance=kindergarten-email-checker \
            -o jsonpath='{range .items[*]}{.status.containerStatuses[0].imageID}{"\n"}{end}' | sort -u)
          {
            echo "## Deploy: $OUTCOME"
            echo
            echo "- **Tag:** \`$TAG\`"
            echo "- **Chart from:** \`$GITHUB_REF_NAME\`"
            echo "- **Helm revision:** $revision"
            echo "- **Running image:** \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
