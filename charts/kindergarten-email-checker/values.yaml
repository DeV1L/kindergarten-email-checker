image:
  repository: ghcr.io/dev1l/kindergarten-email-checker
  tag: ""
  pullPolicy: Always

# Secret with all settings from .env. The chart does not create it. Create it from .env:
existingSecret: kindergarten-email-checker

# Extra environment variables. They override the values in the secret.
env: {}
#  LOG_LEVEL: DEBUG

# Port of the health checks /readyz and /livez. The chart passes it to the app as HEALTH_PORT.
healthPort: 8080

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 128Mi
