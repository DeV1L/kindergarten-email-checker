apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "checker.labels" . | nindent 4 }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  # Exactly one instance. Two instances would read the same mailbox and post every email twice.
  replicas: 1
  # On an update, the old pod runs until the new pod is ready, so a bad deploy leaves the old one.
  # The new pod polls only after its start check, so both pods poll only for a few seconds.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "checker.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "checker.labels" . | nindent 8 }}
      # A new value on each helm upgrade replaces the pod. The new pod pulls the tag again, also latest.
      annotations:
        rollme: {{ randAlphaNum 8 | quote }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: checker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          env:
            # The probes use this port, so the chart sets it. HEALTH_PORT in the secret has no effect.
            - name: HEALTH_PORT
              value: {{ .Values.healthPort | quote }}
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: health
              containerPort: {{ .Values.healthPort }}
          # /readyz: the start check of Telegram, Gmail and DeepSeek passed. Until then the app does not poll.
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: {{ .Values.readinessPeriodSeconds }}
          # /livez: the process runs and answers.
          livenessProbe:
            httpGet:
              path: /livez
              port: health
            periodSeconds: {{ .Values.livenessPeriodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
